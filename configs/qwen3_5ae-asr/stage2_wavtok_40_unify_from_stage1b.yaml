### model
# Stage 2 LoRA on Phase 1b-A (multi-task projector pretrain) ckpt as base.
# Compares against stage2_wavtok_40_unify.yaml (which starts from ASR-only Stage 1 ckpt-100000).
# Hypothesis: projector pre-aligned to multi-task subspace gives Stage 2 LoRA more capacity
# to adapt LLM (instead of dragging projector out of ASR-friendly subspace).
# All other hyperparameters identical to baseline for fair comparison.
model_name_or_path: /mnt/ddn/users/sehyun/AudioEncoder/audiollm-trainer/external/ckpts/Qwen3.5_wavtok_40_unify_Stage1b_resume/Qwen3.5_wavtok_40_unify_Stage1b_resume
flash_attn: fa2
enable_liger_kernel: true
disable_gradient_checkpointing: false
trust_remote_code: true

### method
stage: omni
do_train: true
do_eval: false
finetuning_type: lora
freeze_vision_tower: true
freeze_multi_modal_projector: true
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj
additional_target: audio_encoder.projector
deepspeed: /mnt/ddn/users/sehyun/AudioEncoder/audiollm-trainer/configs/qwen3_5ae-asr/ds_z2_no_fused.json
compute_accuracy: false
report_to: [tensorboard, wandb]

### dataset
# Same manifest as baseline Stage 2 for direct comparability.
dataset: speechx_v9
omni_manifest: /mnt/tmp/listen_analysis/train_manifest/stage2_combined_shards_eprandom
load_from_nubes: true
omni_packing_bucket_size: 128
omni_sample_rate: 24000
omni_hop_length: 600
omni_max_audio_samples: 720000   # 30s @ 24kHz (1080000=45s caused 32-bit overflow in SEANet)
template: omni
cutoff_len: 3584
overwrite_cache: false
preprocessing_num_workers: 16
streaming: true
packing: true
neat_packing: true
preprocessing_batch_size: 2
predict_with_generate: false
dataloader_pin_memory: true
dataloader_num_workers: 4
dataloader_prefetch_factor: 4
dataloader_persistent_workers: false
accelerator_config:
  split_batches: false
  dispatch_batches: false
  non_blocking: true

### output
run_name: Qwen3.5AE-Stage2-wavtok-40-unify-from-Stage1b-lora64
output_dir: /mnt/tmp/results/Qwen3.5AE-wavtok-Stage2-lora64-from-Stage1b
logging_dir: /mnt/tmp/results/Qwen3.5AE-wavtok-Stage2-lora64-from-Stage1b
logging_steps: 5
save_steps: 1000
plot_loss: false
overwrite_output_dir: true

### train
per_device_train_batch_size: 3
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
weight_decay: 0.01
max_steps: 50000
lr_scheduler_type: warmup_stable_decay
warmup_steps: 1000
bf16: true
ddp_timeout: 180000000

### eval
eval_dataset: speechx_v9
