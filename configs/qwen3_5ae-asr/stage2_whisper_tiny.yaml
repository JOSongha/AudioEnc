### model
# Whisper-tiny Stage-1 final ckpt (loss 0.185, test-clean WER 3.57% @ 13k steps).
# Stage-1 trained the 4-layer Llama causal projector while freezing the Whisper-tiny encoder.
# Stage-2 = LoRA on Qwen LLM attention + full-trainable projector (audio_encoder.projector.*).
model_name_or_path: /mnt/ddn/users/sehyun/AudioEncoder/audiollm-trainer/external/ckpts/Qwen3.5_whisper_tiny_Stage1/Qwen3.5_whisper_tiny_Stage1/checkpoint-13000
flash_attn: fa2
enable_liger_kernel: true
disable_gradient_checkpointing: false
trust_remote_code: true

### method
stage: omni
do_train: true
do_eval: false
finetuning_type: lora
freeze_vision_tower: true
freeze_multi_modal_projector: true
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj
additional_target: audio_encoder.projector
deepspeed: /mnt/ddn/users/jos/audiollm-trainer/configs/qwen3_5ae-asr/ds_z2_no_fused.json
compute_accuracy: false
report_to: [tensorboard, wandb]

### dataset
# Same v2 manifest as the small variant; routing differs only in encoder-side audio_features pipeline.
dataset: speechx_v9
omni_manifest: /mnt/tmp/listen_analysis/train_manifest/stage2_combined_shards_eprandom
load_from_nubes: true
omni_packing_bucket_size: 128
omni_max_audio_samples: 480000   # Whisper hard cap: 30s @ 16kHz
template: omni
cutoff_len: 3584
overwrite_cache: false
preprocessing_num_workers: 16
streaming: true
packing: true
neat_packing: true
preprocessing_batch_size: 2
predict_with_generate: false
dataloader_pin_memory: true
dataloader_num_workers: 4
dataloader_prefetch_factor: 4
dataloader_persistent_workers: false
accelerator_config:
  split_batches: false
  dispatch_batches: false
  non_blocking: true

### output
run_name: Qwen3.5AE-Stage2-whisper-tiny-emoFull-asr033-env05-txt03
output_dir: /mnt/tmp/results
logging_dir: /mnt/tmp/results
logging_steps: 5
save_steps: 1000
plot_loss: false
overwrite_output_dir: true

### train
per_device_train_batch_size: 3
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
weight_decay: 0.01
max_steps: 50000
lr_scheduler_type: warmup_stable_decay
warmup_steps: 1000
bf16: true
ddp_timeout: 180000000

### eval
eval_dataset: speechx_v9
