### model
# Resume from Stage 1's best ckpt (step 42000, test-clean WER 7.28%) with overlay:
#   - audio_encoder.py  -> branched version (fires gaussian noise aug during training)
#   - config.json        -> audio_config.noise_aug_enabled=true, noise_aug_max_k=0.1
# See /mnt/tmp/s2_init_42k/ (cp -al from archive + overlay from models/Qwen3.5AE-4B-s2/).
model_name_or_path: /mnt/tmp/s2_init_42k
flash_attn: fa2   # needs LD_PRELOAD glibc_compat.so shim (see run_nsml.sh / launch env)
enable_liger_kernel: true   # Kept ON; per-task loss logging uses a forward hook on Qwen3_5AEModel to capture last_hidden_state (see trainer.py _ensure_hidden_hook).
disable_gradient_checkpointing: false
trust_remote_code: true

### method
stage: omni
do_train: true
do_eval: false
finetuning_type: lora
# Projector stays full-trainable (workflow.py requires_grad override keeps
# audio_encoder.projector.* unfrozen). LoRA wraps only Qwen LLM attention because
# qwen3_5_ae is registered in COMPOSITE_MODELS with audio_encoder / audio_encoder.projector
# as forbidden keys, and the two freeze flags below feed that exclusion path.
freeze_vision_tower: true
freeze_multi_modal_projector: true
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj
# Projector is NOT wrapped with LoRA (it's full-trainable). peft's default save path
# only writes the adapter, so without this flag projector weight updates would be lost
# on every checkpoint save. additional_target -> peft `modules_to_save` -> projector is
# saved as a full module alongside the adapter.
additional_target: audio_encoder.projector
deepspeed: /mnt/ddn/users/jos/audiollm-trainer/configs/qwen3_5ae-asr/ds_z2_no_fused.json  # HF AdamW (avoid DS fused_adam JIT build)
compute_accuracy: false
report_to: [tensorboard, wandb]

### dataset
# Combined 4-modality manifest (ASR 25 / Emo 30 / Env 30 / Text 15), 136 907 rows.
# Built by scripts/emo/build_combined_manifest.py — concatenates per-category
# manifests (ASR superset subsample + emotion MCQA + env-sound + text SFT).
# ASR rows carry `nubes_path` (loaded over HTTP), other modalities use local `path`.
# Per-row `modality` drives template branching in create_omni_processor.
dataset: speechx_v9  # unused when omni_manifest is set
omni_manifest: /mnt/tmp/listen_analysis/train_manifest/stage2_combined_shards
load_from_nubes: true
omni_packing_bucket_size: 128
omni_max_audio_samples: 1600000  # ~33.3s @ 48kHz; drops longer clips (gs has many)
template: omni  # unused when omni_manifest is set
cutoff_len: 3584
overwrite_cache: false
preprocessing_num_workers: 16
streaming: true
packing: true
neat_packing: true
preprocessing_batch_size: 2
predict_with_generate: false
dataloader_pin_memory: true
dataloader_num_workers: 4
dataloader_prefetch_factor: 4
dataloader_persistent_workers: false
accelerator_config:
  split_batches: false
  dispatch_batches: false
  non_blocking: true

### output
run_name: Qwen3.5AE-Stage2-lora-asr14-emo34-env35-txt17
output_dir: /mnt/tmp/results
logging_dir: /mnt/tmp/results
logging_steps: 5
save_steps: 1000
# save_total_limit intentionally omitted — never auto-rotate (post-hoc eval needs every ckpt)
plot_loss: false
overwrite_output_dir: true

### train
per_device_train_batch_size: 3
gradient_accumulation_steps: 1
learning_rate: 1.0e-5            # Stage 2 LoRA LR — much lower than Stage 1 projector (2e-4)
weight_decay: 0.01
max_steps: 50000                 # half of Stage 1; S1 projector already converged
lr_scheduler_type: warmup_stable_decay
warmup_steps: 1000
bf16: true
ddp_timeout: 180000000

### eval
eval_dataset: speechx_v9  # unused
