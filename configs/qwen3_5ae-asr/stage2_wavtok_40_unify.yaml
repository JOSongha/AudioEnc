### model
# WavTok-40-unify Stage-1 final ckpt (step 100000, min loss 0.218 @ step 90055).
# Stage-1 trained the 4-layer Llama causal projector while freezing the WavTokenizer encoder.
# Stage-2 = LoRA on Qwen LLM attention + full-trainable projector (audio_encoder.projector.*).
model_name_or_path: /mnt/ddn/users/sehyun/AudioEncoder/audiollm-trainer/external/ckpts/Qwen3.5_wavtok_40_unify_Stage1/Qwen3.5_wavtok_40_unify_Stage1/checkpoint-100000
flash_attn: fa2
enable_liger_kernel: true
disable_gradient_checkpointing: false
trust_remote_code: true

### method
stage: omni
do_train: true
do_eval: false
finetuning_type: lora
freeze_vision_tower: true
freeze_multi_modal_projector: true
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj
additional_target: audio_encoder.projector
deepspeed: /mnt/ddn/users/sehyun/AudioEncoder/audiollm-trainer/configs/qwen3_5ae-asr/ds_z2_no_fused.json
compute_accuracy: false
report_to: [tensorboard, wandb]

### dataset
# v2 epoch-random manifest (1,168,420 rows over 20 epochs; rebuilt 2026-04-29, full data).
# Pool sizes: emotion 15,663 / asr 40,000 / env 46,805 / text 20,519
# Per-epoch fractions: emotion 1.0 / asr 0.33 / env 0.5 / text 0.3
dataset: speechx_v9  # unused when omni_manifest is set
omni_manifest: /mnt/tmp/listen_analysis/train_manifest/stage2_combined_shards_eprandom
load_from_nubes: true
omni_packing_bucket_size: 128
omni_sample_rate: 24000       # WavTokenizer native sample rate
omni_hop_length: 600          # wavtok_hop_length from model config (40 tokens/s)
omni_max_audio_samples: 1080000  # 45s @ 24kHz; no hard cap for WavTok
template: omni  # unused when omni_manifest is set
cutoff_len: 3584
overwrite_cache: false
preprocessing_num_workers: 16
streaming: true
packing: true
neat_packing: true
preprocessing_batch_size: 2
predict_with_generate: false
dataloader_pin_memory: true
dataloader_num_workers: 4
dataloader_prefetch_factor: 4
dataloader_persistent_workers: false
accelerator_config:
  split_batches: false
  dispatch_batches: false
  non_blocking: true

### output
run_name: Qwen3.5AE-Stage2-wavtok-40-unify-emoFull-asr033-env05-txt03-lora64
output_dir: /mnt/tmp/results/Qwen3.5AE-wavtok-Stage2-lora64
logging_dir: /mnt/tmp/results/Qwen3.5AE-wavtok-Stage2-lora64
logging_steps: 5
save_steps: 1000
plot_loss: false
overwrite_output_dir: true

### train
per_device_train_batch_size: 3
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
weight_decay: 0.01
max_steps: 50000
lr_scheduler_type: warmup_stable_decay
warmup_steps: 1000
bf16: true
ddp_timeout: 180000000

### eval
eval_dataset: speechx_v9  # unused
