### model
# Whisper-small Stage-1 final ckpt (loss 0.146, test-clean WER 2.58% @ 13k steps).
# Stage-1 trained the 4-layer Llama causal projector while freezing the Whisper-small encoder.
# Stage-2 = LoRA on Qwen LLM attention + full-trainable projector (audio_encoder.projector.*).
model_name_or_path: /mnt/ddn/users/sehyun/AudioEncoder/audiollm-trainer/external/ckpts/Qwen3.5_whisper_small_Stage1/Qwen3.5_whisper_small_Stage1/checkpoint-13000
flash_attn: fa2   # needs LD_PRELOAD glibc_compat.so shim (see run_nsml.sh / launch env)
enable_liger_kernel: true
disable_gradient_checkpointing: false
trust_remote_code: true

### method
stage: omni
do_train: true
do_eval: false
finetuning_type: lora
freeze_vision_tower: true
freeze_multi_modal_projector: true
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj
# Projector saved as full module (peft modules_to_save) alongside LoRA adapter.
additional_target: audio_encoder.projector
deepspeed: /mnt/ddn/users/jos/audiollm-trainer/configs/qwen3_5ae-asr/ds_z2_no_fused.json
compute_accuracy: false
report_to: [tensorboard, wandb]

### dataset
# Reuse v2 epoch-random manifest (1.84M rows, 20 epochs, emo 43% / asr 14% / env 36% / text 7%).
# Whisper variant uses omni_dataset_whisper.py (auto-routed by encoder type in omni_dataset.py).
# Auto 16kHz resample via audio_io.load_audio_chunk → log-mel [80,3000] via WhisperFeatureExtractor.
dataset: speechx_v9  # unused when omni_manifest is set
omni_manifest: /mnt/tmp/listen_analysis/train_manifest/stage2_combined_shards_eprandom
load_from_nubes: true
omni_packing_bucket_size: 128
# Whisper hard cap: 30s @ 16kHz = 480_000 samples (vs DAC's 33.3s @ 48kHz = 1.6M).
omni_max_audio_samples: 480000
template: omni  # unused when omni_manifest is set
cutoff_len: 3584
overwrite_cache: false
preprocessing_num_workers: 16
streaming: true
packing: true
neat_packing: true
preprocessing_batch_size: 2
predict_with_generate: false
dataloader_pin_memory: true
dataloader_num_workers: 4
dataloader_prefetch_factor: 4
dataloader_persistent_workers: false
accelerator_config:
  split_batches: false
  dispatch_batches: false
  non_blocking: true

### output
run_name: Qwen3.5AE-Stage2-whisper-small-emoFull-asr033-env05-txt03
output_dir: /mnt/tmp/results
logging_dir: /mnt/tmp/results
logging_steps: 5
save_steps: 1000
plot_loss: false
overwrite_output_dir: true

### train
per_device_train_batch_size: 3
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
weight_decay: 0.01
max_steps: 50000
lr_scheduler_type: warmup_stable_decay
warmup_steps: 1000
bf16: true
ddp_timeout: 180000000

### eval
eval_dataset: speechx_v9  # unused
