### model
# Whisper-small Stage-1 final ckpt (step 13k, test-clean WER 2.58%).
model_name_or_path: /mnt/ddn/users/sehyun/AudioEncoder/audiollm-trainer/external/ckpts/Qwen3.5_whisper_small_Stage1/Qwen3.5_whisper_small_Stage1/checkpoint-13000
flash_attn: fa2
enable_liger_kernel: true
disable_gradient_checkpointing: false
trust_remote_code: true

### method
stage: omni
do_train: true
do_eval: false
finetuning_type: lora
freeze_vision_tower: true
freeze_multi_modal_projector: true
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.0
lora_target: q_proj,k_proj,v_proj,o_proj
additional_target: audio_encoder.projector
deepspeed: /mnt/ddn/users/sehyun/AudioEncoder/audiollm-trainer/configs/qwen3_5ae-asr/ds_z2_no_fused.json
compute_accuracy: false
report_to: [tensorboard, wandb]

### dataset
dataset: speechx_v9
omni_manifest: /mnt/tmp/listen_analysis/train_manifest/esc50_closedset/shards_all
omni_packing_bucket_size: 32
omni_max_audio_samples: 480000   # Whisper hard cap: 30s @ 16kHz
template: omni
cutoff_len: 2048
overwrite_cache: false
preprocessing_num_workers: 8
streaming: true
packing: true
neat_packing: true
preprocessing_batch_size: 2
predict_with_generate: false
dataloader_pin_memory: true
dataloader_num_workers: 2
dataloader_prefetch_factor: 4
dataloader_persistent_workers: false
accelerator_config:
  split_batches: false
  dispatch_batches: false
  non_blocking: true

### output
run_name: Qwen3.5AE-esc50-overfit-whisper-small-lora32
output_dir: /mnt/tmp/results/esc50_overfit_whisper_small
logging_dir: /mnt/tmp/results/esc50_overfit_whisper_small
logging_steps: 5
save_steps: 500
plot_loss: false
overwrite_output_dir: true

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 1
learning_rate: 5.0e-5
weight_decay: 0.0
max_steps: 10000
lr_scheduler_type: warmup_stable_decay
warmup_steps: 100
bf16: true
ddp_timeout: 180000000

### eval
eval_dataset: speechx_v9
