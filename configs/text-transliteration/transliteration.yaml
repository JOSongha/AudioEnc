### model
model_name_or_path: /home/nsml/workspace/models/hcx-jessica-seorak-rft-vocexp

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: /home/nsml/workspace/LLaMA-Factory/examples/deepspeed/ds_z2_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]
report_to: [tensorboard, wandb]

### dataset
dataset_dir: /mnt/fr20tb/audiollm/sanghyuk/datasets/transliteration
dataset: transliteration_train
eval_dataset: transliteration_valid
template: speechx_empty
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 2
streaming: false
packing: true
neat_packing: true
preprocessing_batch_size: 2048
predict_with_generate: false
dataloader_pin_memory: true
accelerator_config:
  split_batches: false
  dispatch_batches: false
  non_blocking: true
tokenized_path: /mnt/tmp/tn_dataset/packed

### output
output_dir: /mnt/fr20tb/audiollm/sanghyuk/results/models
logging_dir: /mnt/tmp/results/runs
logging_steps: 25
save_steps: 50
plot_loss: false
overwrite_output_dir: true
save_total_limit: 10
save_strategy: steps
load_best_model_at_end: false

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 1.0e-5
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.125
bf16: true
ddp_timeout: 180000000
weight_decay: 0.001
dataloader_prefetch_factor: 2
dataloader_num_workers: 8
dataloader_persistent_workers: false
resume_from_checkpoint: false

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 25

## additional configs
flash_attn: fa2
enable_liger_kernel: true
