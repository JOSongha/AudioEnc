### model
model_name_or_path: /mnt/ddn/users/sehyun/AudioEncoder/audiollm-trainer/external/models/Qwen3.5AE-4B-whisper-small
flash_attn: fa2
enable_liger_kernel: true
disable_gradient_checkpointing: false
trust_remote_code: true

### method
stage: omni
do_train: true
do_eval: false
finetuning_type: full
compute_accuracy: false
report_to: [tensorboard]   # no wandb for smoke

### dataset
dataset: speechx_v9
omni_manifest: /mnt/ddn/users/sehyun/AudioEncoder/audiollm-trainer/external/datasets/libri_mls_vox
load_from_nubes: true
omni_packing_bucket_size: 8           # small
omni_max_audio_samples: 480000
template: omni
cutoff_len: 1024                      # small
overwrite_cache: false
preprocessing_num_workers: 4
streaming: true
packing: true
neat_packing: true
preprocessing_batch_size: 2
predict_with_generate: false
dataloader_pin_memory: true
dataloader_num_workers: 2
dataloader_prefetch_factor: 2
dataloader_persistent_workers: false

### output
run_name: Qwen3.5_whisper_small_Stage1_smoke
output_dir: /tmp/qwen3_5_whisper_small_smoke
logging_dir: /tmp/qwen3_5_whisper_small_smoke
logging_steps: 1
save_steps: 100000                    # don't save in smoke
save_total_limit: 1
plot_loss: false
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 2.0e-4
weight_decay: 0.01
max_steps: 2
lr_scheduler_type: constant
warmup_steps: 0
bf16: true
ddp_timeout: 180000000
