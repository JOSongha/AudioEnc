### model
# DAC-VAE v3: shape-frozen DAC encoder + AudioProjector trained from scratch.
# Same backbone as v2; v3 expands the data mix from libri/mls/vox alone to
# libri+mls+vox + sound captioning (clotho/audiocaps/macs/laion×4/audioset/fsd50k)
# + 7-dataset emotion MCQA. See docs/stage1_dac_vae_v3_data.md for catalog.
model_name_or_path: /mnt/ddn/users/jos/audiollm-trainer/external/models/Qwen3.5AE-4B
flash_attn: fa2
enable_liger_kernel: true
disable_gradient_checkpointing: false
trust_remote_code: true

### method
stage: omni
do_train: true
do_eval: false
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json
compute_accuracy: false
report_to: [tensorboard, wandb]

### dataset
dataset: speechx_v9  # unused when omni_manifest is set
# v3 manifest dir mixes ASR (nubes_path) + sound (audio_path) + emotion MCQA.
# Loader picks nubes vs. local automatically per-row when load_from_nubes=true.
omni_manifest: /mnt/tmp/datasets/manifests/v3
load_from_nubes: true
omni_packing_bucket_size: 128
# DAC-VAE native: 48 kHz, hop 1920 — defaults from data_args.py, kept implicit.
omni_max_audio_samples: 1440000   # 30s @ 48k (longer clips dropped — v3 LAION has up to 45s, OOM at 45s+45s+45s pack)
template: omni
cutoff_len: 3584
overwrite_cache: false
preprocessing_num_workers: 16
streaming: true
packing: true
neat_packing: true
preprocessing_batch_size: 2
predict_with_generate: false
dataloader_pin_memory: true
dataloader_num_workers: 16
dataloader_prefetch_factor: 8
dataloader_persistent_workers: false
accelerator_config:
  split_batches: false
  dispatch_batches: false
  non_blocking: true

### output (kept on /mnt/tmp xfs — Lustre quota is full at the cluster level)
run_name: Qwen3.5AE-ASR-Stage1-dac-vae-v3
output_dir: /mnt/tmp/Qwen3.5_dac_vae_v3_Stage1_jos
logging_dir: /mnt/tmp/Qwen3.5_dac_vae_v3_Stage1_jos
logging_steps: 5
save_steps: 1000
plot_loss: false
overwrite_output_dir: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 2.0e-4
weight_decay: 0.01
max_steps: 100000
lr_scheduler_type: warmup_stable_decay
warmup_steps: 1000
bf16: true
ddp_timeout: 180000000

### eval
eval_dataset: speechx_v9  # unused
