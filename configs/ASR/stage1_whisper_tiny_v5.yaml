### model
# Whisper-tiny v4: same per-modality interleave as DAC-VAE v4, swapped encoder.
# Encoder: Whisper-tiny (16kHz, 3000-frame log-mel via WhisperFeatureExtractor)
model_name_or_path: /mnt/ddn/users/jos/audiollm-trainer/external/models/Qwen3.5AE-4B-whisper-tiny-projL
flash_attn: fa2
enable_liger_kernel: true
disable_gradient_checkpointing: true
trust_remote_code: true

### method
stage: omni
do_train: true
do_eval: false
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json
compute_accuracy: false
report_to: [tensorboard, wandb]

### dataset (v4 per-modality interleave)
dataset: speechx_v9  # unused when omni_per_modality_manifests is set
omni_per_modality_manifests:
  audio_asr:        /mnt/tmp/datasets/manifests/v5/audio_asr
  audio_env_sound:  /mnt/tmp/datasets/manifests/v5/audio_env_sound
  audio_emotion:    /mnt/tmp/datasets/manifests/v5/audio_emotion
omni_per_modality_probs:
  audio_asr:        0.65
  audio_env_sound:  0.25
  audio_emotion:    0.10
omni_per_modality_stopping: all_exhausted
load_from_nubes: true
omni_packing_bucket_size: 128
omni_shuffle_buffer_size: 10000
omni_max_audio_samples: 480000   # 30s @ 16kHz (Whisper input cap)
template: omni
cutoff_len: 3584
overwrite_cache: false
preprocessing_num_workers: 16
streaming: true
packing: true
neat_packing: true
preprocessing_batch_size: 2
predict_with_generate: false
dataloader_pin_memory: true
dataloader_num_workers: 16
dataloader_prefetch_factor: 8
dataloader_persistent_workers: false
accelerator_config:
  split_batches: false
  dispatch_batches: false
  non_blocking: true

### output
run_name: Qwen3.5AE-ASR-Stage1-whisper-tiny-v5
output_dir: /mnt/tmp/Qwen3.5_whisper_tiny_v5_Stage1_jos
logging_dir: /mnt/tmp/Qwen3.5_whisper_tiny_v5_Stage1_jos
logging_steps: 50
save_steps: 1000
save_total_limit: 8
plot_loss: false
overwrite_output_dir: true
ignore_data_skip: true  # streaming dataset에서 24k batch skip은 매우 느려서 우회

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 2  # effective batch unchanged (2*2 = 4 per device)
learning_rate: 2.0e-4
weight_decay: 0.01
max_steps: 100000
lr_scheduler_type: warmup_stable_decay
warmup_steps: 1000
bf16: true
ddp_timeout: 180000000

### eval
eval_dataset: speechx_v9  # unused
