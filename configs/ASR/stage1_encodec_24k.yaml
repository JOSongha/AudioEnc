### model
model_name_or_path: /mnt/ddn/users/sehyun/AudioEncoder/audiollm-trainer/external/models/Qwen3.5AE-4B-encodec-24k
flash_attn: fa2
enable_liger_kernel: true
disable_gradient_checkpointing: true
trust_remote_code: true

### method
stage: omni  # omni workflow freezes all params except audio_encoder.projector
do_train: true
do_eval: false
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json
compute_accuracy: false
report_to: [tensorboard, wandb]

### dataset
dataset: speechx_v9  # unused when omni_manifest is set
omni_manifest: /mnt/ddn/users/sehyun/AudioEncoder/audiollm-trainer/external/datasets/libri_mls_vox
load_from_nubes: true
omni_packing_bucket_size: 128
omni_sample_rate: 24000
omni_hop_length: 320              # 24000 / 75 fps
omni_max_audio_samples: 1080000   # 45s @ 24k
template: omni
cutoff_len: 6144                  # EnCodec-only; accommodates 3375 frames + text headroom
overwrite_cache: false
preprocessing_num_workers: 16
streaming: true
packing: true
neat_packing: true
preprocessing_batch_size: 2
predict_with_generate: false
dataloader_pin_memory: true
dataloader_num_workers: 16
dataloader_prefetch_factor: 8
dataloader_persistent_workers: false
accelerator_config:
  split_batches: false
  dispatch_batches: false
  non_blocking: true

### output (kept on /mnt/tmp xfs — Lustre quota is full at the cluster level)
run_name: Qwen3.5AE-ASR-Stage1-encodec-24k
output_dir: /mnt/tmp/Qwen3.5_encodec_24k_Stage1_jos
logging_dir: /mnt/tmp/Qwen3.5_encodec_24k_Stage1_jos
# TODO(sehyun): switch back to DDN when quota available
# run_name: Qwen3.5_encodec_24k_Stage1
# output_dir: /mnt/ddn/users/sehyun/AudioEncoder/audiollm-trainer/external/ckpts/Qwen3.5_encodec_24k_Stage1
# logging_dir: /mnt/ddn/users/sehyun/AudioEncoder/audiollm-trainer/external/ckpts/Qwen3.5_encodec_24k_Stage1
logging_steps: 5
save_steps: 1000
save_total_limit: 8
plot_loss: false
overwrite_output_dir: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 2
learning_rate: 2.0e-4
weight_decay: 0.01
max_steps: 100000
lr_scheduler_type: warmup_stable_decay
warmup_steps: 1000
bf16: true
ddp_timeout: 180000000

### eval
eval_dataset: speechx_v9  # unused
