### model
# DAC-VAE v2: shape-frozen DAC encoder + AudioProjector trained from scratch.
# Same architecture/hparams as the prior `Qwen3.5AE-ASR-Stage1-libri_mls_vox` run
# that produced /mnt/tmp/s2_init_42k; rerunning to keep all checkpoints this time
# (prior run had save_total_limit=8 which rotated out earlier ckpts).
model_name_or_path: /mnt/ddn/users/jos/audiollm-trainer/external/models/Qwen3.5AE-4B
flash_attn: fa2
enable_liger_kernel: true
disable_gradient_checkpointing: true
trust_remote_code: true

### method
stage: omni  # omni workflow freezes all params except audio_encoder.projector
do_train: true
do_eval: false
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json
compute_accuracy: false
report_to: [tensorboard, wandb]

### dataset
dataset: speechx_v9  # unused when omni_manifest is set
omni_manifest: /mnt/ddn/users/sehyun/AudioEncoder/audiollm-trainer/external/datasets/libri_mls_vox
load_from_nubes: true
omni_packing_bucket_size: 128
# DAC-VAE native: 48 kHz, hop 1920 — defaults from data_args.py, kept implicit.
omni_max_audio_samples: 2160000   # 45s @ 48k
template: omni
cutoff_len: 3584
overwrite_cache: false
preprocessing_num_workers: 16
streaming: true
packing: true
neat_packing: true
preprocessing_batch_size: 2
predict_with_generate: false
dataloader_pin_memory: true
dataloader_num_workers: 16
dataloader_prefetch_factor: 8
dataloader_persistent_workers: false
accelerator_config:
  split_batches: false
  dispatch_batches: false
  non_blocking: true

### output (kept on /mnt/tmp xfs — Lustre quota is full at the cluster level)
run_name: Qwen3.5AE-ASR-Stage1-dac-vae-v2
output_dir: /mnt/tmp/Qwen3.5_dac_vae_v2_Stage1_jos
logging_dir: /mnt/tmp/Qwen3.5_dac_vae_v2_Stage1_jos
logging_steps: 5
save_steps: 1000
# save_total_limit intentionally omitted — keep every checkpoint. Prior libri_mls_vox
# run rotated ckpt-40000 out before eval, hence this rerun.
plot_loss: false
overwrite_output_dir: true

### train
per_device_train_batch_size: 3
gradient_accumulation_steps: 1
learning_rate: 2.0e-4
weight_decay: 0.01
max_steps: 100000
lr_scheduler_type: warmup_stable_decay
warmup_steps: 1000
bf16: true
ddp_timeout: 180000000

### eval
eval_dataset: speechx_v9  # unused
