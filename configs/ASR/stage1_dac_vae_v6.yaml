### model
# DAC-VAE v6: same projL projector as v5 (H=1024 I=4096 heads=16 ~70M, 3×).
# v6 swaps the manifest pool to /mnt/tmp/datasets/manifests/v6_nubes/, which adds
# IEMOCAP Sessions 1-4 (audio_emotion 41,172 → 47,054) and GigaSpeech XL 50%
# random subsample (audio_asr 11,345,224 → 15,478,224, +5,000 h). Mixing
# weights and trainer hyperparams unchanged from v5.
model_name_or_path: external/models/Qwen3.5AE-4B-projL
flash_attn: fa2
enable_liger_kernel: true
disable_gradient_checkpointing: false
trust_remote_code: true

### method
stage: omni
do_train: true
do_eval: false
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json
compute_accuracy: false
report_to: [tensorboard, wandb]

### dataset
dataset: speechx_v9  # unused when omni_per_modality_manifests is set
omni_per_modality_manifests:
  audio_asr:        /mnt/tmp/datasets/manifests/v6_nubes/audio_asr
  audio_env_sound:  /mnt/tmp/datasets/manifests/v6_nubes/audio_env_sound
  audio_emotion:    /mnt/tmp/datasets/manifests/v6_nubes/audio_emotion
omni_per_modality_probs:
  audio_asr:        0.65
  audio_env_sound:  0.25
  audio_emotion:    0.10
omni_per_modality_stopping: all_exhausted
load_from_nubes: true
omni_packing_bucket_size: 128
omni_shuffle_buffer_size: 10000
omni_max_audio_samples: 1440000   # 30s @ 48k
template: omni
cutoff_len: 3584
overwrite_cache: false
preprocessing_num_workers: 16
streaming: true
packing: true
neat_packing: true
preprocessing_batch_size: 2
predict_with_generate: false
dataloader_pin_memory: true
dataloader_num_workers: 16
dataloader_prefetch_factor: 8
dataloader_persistent_workers: false
accelerator_config:
  split_batches: false
  dispatch_batches: false
  non_blocking: true

### output (kept on /mnt/tmp xfs — Lustre quota is full at the cluster level)
run_name: Qwen3.5AE-ASR-Stage1-dac-vae-v6
output_dir: /mnt/tmp/Qwen3.5_dac_vae_v6_Stage1_jos
logging_dir: /mnt/tmp/Qwen3.5_dac_vae_v6_Stage1_jos
logging_steps: 50
save_steps: 1000
plot_loss: false
overwrite_output_dir: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 2.0e-4
weight_decay: 0.01
max_steps: 100000
lr_scheduler_type: warmup_stable_decay
warmup_steps: 1000
bf16: true
ddp_timeout: 180000000

### eval
eval_dataset: speechx_v9  # unused
