### model
# DAC-VAE v4: same backbone as v3. The change is dataset MIXING, not data.
# v3 used a single concatenated manifest where 11.3M ASR rows (94%) drowned
# out 633k sound (5%) and 62k emotion (0.5%) — wandb showed audio_emotion /
# audio_env_sound losses logged only in narrow token windows because the
# alphabetical concat made same-task shards stream together. v4 splits the
# manifest by modality and uses interleave_datasets with explicit
# probabilities, so every global batch sees a mix of all three tasks.
model_name_or_path: /mnt/ddn/users/jos/audiollm-trainer/external/models/Qwen3.5AE-4B
flash_attn: fa2
enable_liger_kernel: true
disable_gradient_checkpointing: false
trust_remote_code: true

### method
stage: omni
do_train: true
do_eval: false
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json
compute_accuracy: false
report_to: [tensorboard, wandb]

### dataset
dataset: speechx_v9  # unused when omni_per_modality_manifests is set
# v4: per-modality interleave. Each modality is its own IterableDataset,
# shuffled with an independent seed; interleave_datasets draws by probability.
# stopping_strategy=all_exhausted lets emotion (62k rows) cycle multiple times
# while libri_mls_vox (11.3M) is still draining — desirable here.
omni_per_modality_manifests:
  audio_asr:        /mnt/tmp/datasets/manifests/v4/audio_asr
  audio_env_sound:  /mnt/tmp/datasets/manifests/v4/audio_env_sound
  audio_emotion:    /mnt/tmp/datasets/manifests/v4/audio_emotion
omni_per_modality_probs:
  audio_asr:        0.65
  audio_env_sound:  0.25
  audio_emotion:    0.10
omni_per_modality_stopping: all_exhausted
load_from_nubes: true
omni_packing_bucket_size: 128
omni_shuffle_buffer_size: 10000
omni_max_audio_samples: 1440000   # 30s @ 48k
template: omni
cutoff_len: 3584
overwrite_cache: false
preprocessing_num_workers: 16
streaming: true
packing: true
neat_packing: true
preprocessing_batch_size: 2
predict_with_generate: false
dataloader_pin_memory: true
dataloader_num_workers: 16
dataloader_prefetch_factor: 8
dataloader_persistent_workers: false
accelerator_config:
  split_batches: false
  dispatch_batches: false
  non_blocking: true

### output (kept on /mnt/tmp xfs — Lustre quota is full at the cluster level)
run_name: Qwen3.5AE-ASR-Stage1-dac-vae-v4
output_dir: /mnt/tmp/Qwen3.5_dac_vae_v4_Stage1_jos
logging_dir: /mnt/tmp/Qwen3.5_dac_vae_v4_Stage1_jos
# v4: bumped from 5 to 50. With v3's 5-step logging the per-modality losses
# were dominated by sampling noise (emotion ~1 sample per 200 steps). With
# interleave at p=0.10 emotion, every 50-step bucket sees ~80 emotion samples
# globally (16 GBS × 50 × 0.10), giving a stable curve.
logging_steps: 50
save_steps: 1000
plot_loss: false
overwrite_output_dir: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 2.0e-4
weight_decay: 0.01
max_steps: 100000
lr_scheduler_type: warmup_stable_decay
warmup_steps: 1000
bf16: true
ddp_timeout: 180000000

### eval
eval_dataset: speechx_v9  # unused
